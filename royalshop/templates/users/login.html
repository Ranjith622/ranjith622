{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="auth-card mx-auto">
    <div class="auth-header text-center mb-4">
      <i class="bi bi-crown-fill gold-text" style="font-size:2.5rem"></i>
      <h3 class="mt-2" style="font-family:'Playfair Display',serif">Welcome Back</h3>
      <p class="text-muted small">Sign in to your RoyalShop account</p>
    </div>
    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label royal-label">Username</label>
        <div class="input-icon-wrap">
          <i class="bi bi-person input-icon"></i>
          <input type="text" name="username" class="form-control royal-input ps-5" required placeholder="Enter username"/>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label royal-label">Password</label>
        <div class="input-icon-wrap">
          <i class="bi bi-lock input-icon"></i>
          <input type="password" name="password" class="form-control royal-input ps-5" required placeholder="Enter password"/>
        </div>
      </div>
      <button type="submit" class="btn btn-gold w-100 btn-lg">
        <i class="bi bi-box-arrow-in-right me-2"></i>Login
      </button>
    </form>
    <p class="text-center mt-3 text-muted">
      Don't have an account? <a href="{% url 'user_register' %}" class="gold-text fw-semibold">Register</a>
    </p>
  </div>
</div>
{% endblock %}
